name: Tests

on:
  push:
    branches: [main]
    paths: [lua/**, tests/**]
  pull_request:
    paths: [lua/**, tests/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        neovim_version: ["v0.10.0", "v0.11.4", "nightly"]
        include:
          - os: macos-latest
            neovim_version: v0.11.4
          - os: windows-latest
            neovim_version: v0.11.4
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -sL https://rclone.org/install.sh | sudo bash
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install rclone
          else
            choco install rclone -y
          fi
        shell: bash

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run tests
        run: make test
