name: Type Checking

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.4

      - name: Clone obsidian.nvim (for type resolution)
        run: |
          git clone --depth 1 https://github.com/obsidian-nvim/obsidian.nvim.git deps/obsidian.nvim

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache emmylua_check
        id: cache-emmylua
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/emmylua_check
          key: emmylua_check-0.23.2

      - name: Install EmmyLua checker
        if: steps.cache-emmylua.outputs.cache-hit != 'true'
        run: cargo install emmylua_check --version 0.23.2 --locked

      - name: Run type checker
        run: make types
